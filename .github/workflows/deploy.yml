name: Deploy to Cloudflare Pages

on:
  # Deploys automatically whenever main changes (docs-only changes are skipped).
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  # Or run it by hand: GitHub → Actions → "Deploy to Cloudflare Pages" → Run workflow.
  workflow_dispatch:
    inputs:
      project_name:
        description: Cloudflare Pages project name (becomes <name>.pages.dev)
        required: true
        default: portfolio

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

env:
  # Push runs have no inputs, so they fall back to the default project name.
  PROJECT_NAME: ${{ inputs.project_name || 'portfolio' }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Creates the Pages project on the first run; fails harmlessly once it exists.
      - name: Create Pages project (first run only)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT_NAME }} --production-branch=main

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=main --commit-dirty=true

      - name: Summary
        run: |
          echo "### Deployed to Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: https://${PROJECT_NAME}.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- This deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
